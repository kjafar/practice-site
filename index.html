<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My first live website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f4ef;
      color: #1f2a37;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      background: #ffffff;
      max-width: 560px;
      width: 100%;
      padding: 40px 36px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(31, 42, 55, 0.08);
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #0f766e;
      background: #ccfbf1;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 30px; line-height: 1.2; margin-bottom: 12px; }
    p { font-size: 17px; line-height: 1.6; color: #4b5563; margin-bottom: 20px; }
    ol { padding-left: 20px; color: #374151; line-height: 1.9; }
    footer { margin-top: 28px; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Practice site</span>
    <h1>Olá! This website is live.</h1>
    <p>If you can read this, the files left my computer, went to a server, and the internet can find them by name.</p>
    <ol>
      <li>I wrote the files (HTML).</li>
      <li>I put them on GitHub.</li>
      <li>Vercel published them at a free address.</li>
    </ol>
    <footer>Built for practice, November 2026.</footer>
  </main>
</body>
</html>
